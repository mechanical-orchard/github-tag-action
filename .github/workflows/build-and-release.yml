name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build TypeScript
        run: npm run build

      - name: Verify lib directory exists
        run: |
          echo "Checking if lib directory exists..."
          ls -la lib/
          echo "Contents of lib directory:"
          find lib -type f

      - name: Package release
        run: |
          tar -czf release.tar.gz lib/ node_modules/ action.yml package.json package-lock.json
          echo "Verifying tar contents..."
          tar -tzf release.tar.gz | grep "^lib/" | head -20

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ inputs.version }} \
            --title "Release ${{ inputs.version }}" \
            --notes "Built and released from commit ${{ github.sha }}" \
            --target ${{ github.ref_name }} \
            release.tar.gz
