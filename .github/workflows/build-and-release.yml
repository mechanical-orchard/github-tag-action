name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build TypeScript
        run: npm run build

      - name: Verify dist directory exists
        run: |
          echo "Checking if dist directory exists..."
          ls -la dist/
          echo "Contents of dist directory:"
          find dist -type f

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit dist folder for release tag only
        run: |
          git add -f dist/
          git commit -m "Release ${{ inputs.version }}: Include bundled dist/ folder with all dependencies"

      - name: Create and push tag (tag only, not branch)
        run: |
          git tag ${{ inputs.version }}
          git push origin ${{ inputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ inputs.version }} \
            --title "Release ${{ inputs.version }}" \
            --notes "Built and released with compiled code included in source archives"
